name: Forge Pipeline

# What this workflow does (in *this* repository):
# - Builds the CLI from the checked-out commit (`npm ci` + `npm run build`) and
#   exposes it with `npm link` so `forge` matches the branch you are testing.
#   (Installing from npm would test whatever is published, not your PR.)
# - Runs deterministic stages: doctor → intake → plan → verify → split.
# - Runs execute + integrate only when the OPENAI_API_KEY repo secret is set
#   (skipped in the shell when unset — GitHub does not allow `secrets` in `if:`).
#
# In other projects you usually install from the registry instead, e.g.:
#   npm install -g @forgecli/forge

on:
  workflow_dispatch:
  push:
    # Omit `dev` (and other PR-only branches): pushes there + an open PR to `main`
    # would trigger both `push` and `pull_request`, running this workflow twice.
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  forge:
    name: Forge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies and build Forge from this commit
        run: |
          npm ci
          npm run build

      - name: Link Forge CLI (global `forge` → this checkout)
        run: npm link

      - name: Forge Doctor
        run: forge doctor --checks node,git,npm,config

      - name: Forge Intake
        run: >
          forge intake --repo . --output-dir .forge
          --prompt "CI pipeline wiring validation."
          --no-llm --json-only

      - name: Forge Plan
        run: forge plan --repo . --output-dir .forge

      - name: Forge Verify
        run: forge verify --repo . --output-dir .forge

      - name: Forge Split
        run: forge split --repo . --output-dir .forge

      - name: Forge Execute
        run: |
          if [ -z "${FORGE_MODEL_API_KEY}" ]; then
            echo "Skipping Forge Execute (set repository secret OPENAI_API_KEY to run this step)."
            exit 0
          fi
          forge execute --repo . --auto --output-dir .forge
        env:
          FORGE_MODEL_PROVIDER: openai
          FORGE_MODEL_NAME: gpt-4o
          FORGE_MODEL_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Forge Integrate
        run: |
          if [ -z "${FORGE_MODEL_API_KEY}" ]; then
            echo "Skipping Forge Integrate (set repository secret OPENAI_API_KEY to run this step)."
            exit 0
          fi
          forge integrate --repo . --auto --output-dir .forge
        env:
          FORGE_MODEL_PROVIDER: openai
          FORGE_MODEL_NAME: gpt-4o
          FORGE_MODEL_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          name: forge-artifacts
          path: |
            .forge/intake.json
            .forge/plan.json
            .forge/verify.json
            .forge/split.json
            .forge/execute.json
            .forge/integrate.json
            .forge/reports/plan-report.md
            .forge/reports/verify-report.md
            .forge/reports/split-report.md
            .forge/execute-report.md
            .forge/integration-report.md
