[features]
multi_agent = true

[agents]
max_threads = 8
max_depth = 1

[agents.backendeng]
description = """Use this agent when you need to design, architect, or evaluate backend systems
  that prioritize data integrity, security, fault tolerance, and overall
  reliability. Examples include: creating a new microservice architecture,
  designing a database schema with ACID guarantees, planning disaster recovery
  strategies, implementing authentication/authorization systems, or reviewing
  backend designs for potential single points of failure."""
config_file = "agents/backendeng.toml"

[agents.frontendeng]
description = """Use this agent when you need to build or implement user interfaces using
  modern frontend frameworks (React, Vue, Svelte, Angular, etc.) where
  accessibility, performance, and user experience are priorities. Examples
  include: creating a new component library, building a responsive dashboard,
  implementing accessible forms, optimizing UI performance, or reviewing
  frontend code for accessibility compliance."""
config_file = "agents/frontendeng.toml"

[agents.optimizer]
description = """Use this agent when you need to optimize or improve existing codebases
  for performance, maintainability, or best practices. Examples include:
  refactoring complex functions, optimizing database queries, improving
  frontend rendering performance, implementing caching strategies, or
  reviewing code for potential performance bottlenecks."""
config_file = "agents/optimizer.toml"

[agents.testautomator]
description = """Use this agent when you need to create or improve automated tests
  for software applications. Examples include: writing unit tests, creating
  integration tests, implementing end-to-end test scenarios, setting up
  CI/CD test pipelines, or reviewing test coverage for completeness."""
config_file = "agents/testautomator.toml"

[agents.securityrev]
description = """Use this agent when you need to perform security reviews of code changes,
  identify vulnerabilities, check for OWASP Top 10 issues, review
  authentication/authorization implementations, or ensure compliance with
  security standards during feature development. Examples: reviewing a new API
  endpoint for injection risks, checking user authentication flow for bypass
  vulnerabilities, auditing data handling code for PII exposure, or evaluating
  third-party dependencies for known CVEs."""
config_file = "agents/securityrev.toml"