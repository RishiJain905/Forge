version: "3.9"

services:
  forge:
    image: forge:latest
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/repo
      - forge-data:/home/forge/.forge
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FORGE_MODEL=${FORGE_MODEL:-openai/gpt-4o}
      - FORGE_MODEL_PROVIDER=${FORGE_MODEL_PROVIDER:-openai}
      - FORGE_MODEL_NAME=${FORGE_MODEL_NAME:-gpt-4o}
      - FORGE_MODEL_API_KEY=${FORGE_MODEL_API_KEY:-$OPENAI_API_KEY}
      - FORGE_MODEL_BASE_URL=${FORGE_MODEL_BASE_URL:-}
      - FORGE_LOG_LEVEL=${FORGE_LOG_LEVEL:-info}
      - FORGE_EXECUTE_PARALLEL=${FORGE_EXECUTE_PARALLEL:-true}
      - FORGE_MAX_WORKSTREAMS=${FORGE_MAX_WORKSTREAMS:-10}
    working_dir: /repo
    command: --help

volumes:
  forge-data:
